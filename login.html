<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — عقاري ذكي</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="logo auth-logo">
      <span class="logo-mark">ع</span>
      عقاري ذكي
    </a>
    <h1>تسجيل الدخول</h1>
    <p class="auth-sub">أهلًا بعودتك، سجّل الدخول لمتابعة إدارة أملاكك.</p>

    <div id="authError" class="auth-error"></div>

    <form id="loginForm" class="auth-form">
      <label>البريد الإلكتروني
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>
      <label>كلمة المرور
        <input type="password" name="password" placeholder="••••••••" required>
      </label>
      <button type="submit" class="btn btn-primary btn-lg auth-submit">دخول</button>
    </form>

    <p class="auth-hint">للتجربة السريعة استخدم: <code>demo@aqari.app</code> / <code>demo1234</code></p>
    <p class="auth-switch">ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a></p>
  </div>
</div>

<script src="api.js"></script>
<script src="auth.js"></script>
<script>initLoginForm();</script>
</body>
</html>
